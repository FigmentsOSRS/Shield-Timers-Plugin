// Local development tasks — not used by Plugin Hub CI.
// Usage:
//   gradlew -b build.dev.gradle run         (launch full RuneLite client with plugin loaded)
//   gradlew -b build.dev.gradle sideloadJar (build jar for sideloading)
//   gradlew -b build.dev.gradle shadowJar   (build fat jar for IntelliJ run)

apply from: "https://raw.githubusercontent.com/runelite/plugin-hub/master/package/build.gradle"

def pluginMainClass = 'com.shieldtimer.ShieldTimerPluginTest'

// IntelliJ run task — launches full RuneLite client with plugin loaded
tasks.register('run', JavaExec) {
	dependsOn 'testClasses'

	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs = [
		'-ea',
		'--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
		'--add-opens=java.base/java.lang=ALL-UNNAMED'
	]

	args = ['--developer-mode', '--debug']
}

// Sideload jar — plugin classes and resources only, no RuneLite internals bundled
// Copy output to: C:\Users\<user>\.runelite\sideloaded-plugins\
tasks.register('sideloadJar', Jar) {
	dependsOn 'classes'

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveFileName.set("${rootProject.name}-${project.version}.jar")
}

// Shadow jar — fat jar for IntelliJ run task (kept for development use)
tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
